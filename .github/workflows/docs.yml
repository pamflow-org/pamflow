name: Build docs

on:
  push:
    paths:
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  schedule:
    - cron: "0 6 * * 1"  # weekly, to catch broken external links

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"  # same as .readthedocs.yaml

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/source/docs_requirements.txt

      - name: Build docs (warnings are errors)
        run: python -m sphinx -W --keep-going -b html docs/source docs/_build/html

  linkcheck:
    runs-on: ubuntu-latest
    # External sites can be down or block bots: report broken links without failing the build.
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/source/docs_requirements.txt

      - name: Check links
        run: python -m sphinx -b linkcheck docs/source docs/_build/linkcheck
